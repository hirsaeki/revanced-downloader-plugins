name: Build pull request

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev

jobs:
  release:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v2

      - name: Build APKMirror release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :apkmirror-downloader:assembleRelease --no-daemon

      - name: Upload APKMirror APK
        uses: actions/upload-artifact@v4
        with:
          name: apkmirror-downloader
          path: apkmirror-downloader/build/outputs/apk/release/*.apk
          if-no-files-found: error
